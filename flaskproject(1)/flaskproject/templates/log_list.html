<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>操作日志</title>
<link rel="stylesheet" href="/static/css/layui.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { padding:24px; background:linear-gradient(145deg,#f6f9fc 0%,#e9f0f5 100%); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; color:#1a2332; }

.top-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.top-bar .brand { font-size:20px; font-weight:700; }
.top-bar .brand i { color:#409eff; margin-right:6px; }

.filter-bar { background:#fff; border-radius:12px; padding:14px 20px; margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.04); display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px; }
.filter-bar label { font-size:11px; font-weight:600; color:#8c939d; text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:2px; }
.filter-bar select, .filter-bar input { height:36px; border:1px solid #dcdfe6; border-radius:6px;
    padding:0 10px; font-size:13px; color:#333; outline:none; }
.filter-bar select:focus, .filter-bar input:focus { border-color:#409eff; }
.filter-group { display:flex; flex-direction:column; }

.card { background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.06); overflow:hidden; }

.action-tag { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; color:#fff; }
.action-登录成功 { background:#5FB878; }
.action-登录失败 { background:#FF5722; }
.action-退出登录 { background:#909399; }
.action-新增员工 { background:#409EFF; }
.action-编辑员工 { background:#FF9800; }
.action-删除员工 { background:#FF5722; }
.action-单次预测 { background:#8B5CF6; }
.action-批量预测 { background:#6366f1; }
.action-生成报告 { background:#14B8A6; }
.action-下载报告 { background:#5FB878; }
.action-发送报告邮件 { background:#F59E0B; }
.action-添加干预记录 { background:#FF9800; }
.action-创建用户 { background:#409EFF; }
.action-修改密码 { background:#909399; }
</style>
</head>
<body>

<div class="top-bar">
    <div class="brand"><i class="layui-icon layui-icon-log"></i> 操作日志</div>
    <span style="font-size:12px;color:#8c939d;">所有关键操作可追溯</span>
</div>

<div class="filter-bar">
    <div class="filter-group">
        <label>操作人</label>
        <input type="text" id="filter-username" placeholder="输入用户名" style="width:140px;">
    </div>
    <div class="filter-group">
        <label>操作类型</label>
        <select id="filter-action" style="width:150px;">
            <option value="">全部类型</option>
        </select>
    </div>
    <div class="filter-group">
        <label>时间范围</label>
        <div style="display:flex;align-items:center;gap:6px;">
            <input type="text" id="filter-start" placeholder="开始日期" style="width:115px;" readonly>
            <span style="color:#c0c4cc;">—</span>
            <input type="text" id="filter-end" placeholder="结束日期" style="width:115px;" readonly>
        </div>
    </div>
    <button class="layui-btn layui-btn-sm" id="btn-query" style="height:36px;line-height:36px;border-radius:6px;">
        <i class="layui-icon layui-icon-search"></i> 查询
    </button>
    <button class="layui-btn layui-btn-sm layui-btn-primary" id="btn-reset" style="height:36px;line-height:36px;border-radius:6px;">重置</button>
    <button class="layui-btn layui-btn-sm layui-btn-danger" id="btn-clean" style="height:36px;line-height:36px;border-radius:6px;margin-left:auto;">
        <i class="layui-icon layui-icon-delete"></i> 清理旧日志
    </button>
</div>

<div class="card">
    <table id="log-table" lay-filter="log-table"></table>
</div>

<script src="/static/layui.js"></script>
<script>
layui.use(['table','layer','laydate','form'], function(){
    var table = layui.table, layer = layui.layer, laydate = layui.laydate, $ = layui.jquery;

    laydate.render({elem:'#filter-start',type:'date',format:'yyyy-MM-dd'});
    laydate.render({elem:'#filter-end',type:'date',format:'yyyy-MM-dd'});

    // 加载操作类型下拉
    function loadActionTypes() {
        $.get('/predict/api/logs/actions', function(res) {
            if (res.code === 0) {
                var html = '<option value="">全部类型</option>';
                res.data.forEach(function(item) {
                    html += '<option value="'+item.name+'">'+item.name+' ('+item.count+')</option>';
                });
                $('#filter-action').html(html);
            }
        });
    }
    loadActionTypes();

    var tableIns = table.render({
        elem:'#log-table', url:'/predict/api/logs', page:true, limit:15, skin:'line',
        where:{username:'',action:'',start_date:'',end_date:''},
        cols:[[
            {field:'created_at', title:'操作时间', width:170, align:'center'},
            {field:'username', title:'操作人', width:100, align:'center'},
            {field:'action', title:'操作类型', width:120, align:'center', templet:'#actionTpl'},
            {field:'target', title:'操作对象', width:160},
            {field:'detail_short', title:'描述', minWidth:180},
            {field:'ip', title:'IP地址', width:130, align:'center'},
        ]],
        done:function(res){ $('#total-info').text('共 '+res.count+' 条'); }
    });

    // 查询/重置
    $('#btn-query').click(function(){
        tableIns.reload({where:{
            username:$('#filter-username').val().trim(),
            action:$('#filter-action').val(),
            start_date:$('#filter-start').val(),
            end_date:$('#filter-end').val()
        }});
    });
    $('#btn-reset').click(function(){
        $('#filter-username').val(''); $('#filter-action').val(''); $('#filter-start').val(''); $('#filter-end').val('');
        tableIns.reload({where:{username:'',action:'',start_date:'',end_date:''}});
    });

    // 清理 90 天前旧日志
    $('#btn-clean').click(function(){
        layer.confirm('确认删除 <strong style="color:#FF5722;">90 天前</strong> 的所有日志记录吗？<br><small style="color:#909399;">此操作不可恢复，建议先导出备份。</small>', {
            title: '清理旧日志',
            icon: 3,
            btn: ['确认清理', '取消'],
            btnAlign: 'c'
        }, function(index){
            layer.close(index);
            var loadIdx = layer.load(1);
            $.post('/log/api/clean', function(res){
                layer.close(loadIdx);
                if(res.code === 0){
                    layer.msg(res.msg, {icon:1});
                    tableIns.reload();
                }else{
                    layer.msg(res.msg, {icon:2});
                }
            }).fail(function(){
                layer.close(loadIdx);
                layer.msg('请求失败，请重试', {icon:2});
            });
        });
    });
});
</script>

{% raw %}
<script type="text/html" id="actionTpl">
    <span class="action-tag action-{{d.action}}">{{d.action}}</span>
</script>
{% endraw %}
</body>
</html>
