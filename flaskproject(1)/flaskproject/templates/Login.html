<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理系统登录</title>
    <link rel="stylesheet" href="/static/css/layui.css">
    <style>
        /* 页面整体背景 */
        body {
            background-color: #f2f2f2;
            background-image: linear-gradient(120deg, #8ee4ea 0%, #51a0f1 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        /* 登录卡片容器 */
        .login-container {
            width: 400px;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
        }

        /* 标题样式 */
        .login-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
        }

        /* 覆盖一些 LayUI 的默认间距 */
        .layui-form-item {
            margin-bottom: 20px;
        }

        /* 让按钮宽度占满 */
        .layui-btn-fluid {
            width: 100%;
            margin-top: 10px;
        }

        /* 底部辅助链接 */
        .login-footer {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #999;
        }

        /* 调整输入框左侧没有 Label 时的间距 */
        .layui-input-block {
            margin-left: 0 !important;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-title">管理系统登录</div>

    <form class="layui-form" action="/login" method="post">
        <div class="layui-form-item">
            <div class="layui-input-block">
                <input type="text" id="username" name="username" required lay-verify="required" placeholder="请输入用户名" autocomplete="off" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-input-block">
                <input type="password" id="password" name="password" required lay-verify="required" placeholder="请输入密码" autocomplete="off" class="layui-input">
            </div>
        </div>

        <!-- 新增：记住密码复选框 -->
        <div class="layui-form-item">
            <div class="layui-input-block">
                <input type="checkbox" id="remember" name="remember" title="记住密码" lay-skin="primary">
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn layui-btn-normal layui-btn-fluid" lay-submit lay-filter="loginSubmit">立即登录</button>
            </div>
        </div>

        <div class="login-footer">
            <a href="javascript:;" style="color: #1e9fff;">忘记密码？</a> | <a href="/register">注册账号</a>
        </div>
    </form>
</div>

<script src="/static/layui.js"></script>
<script>
layui.use(['form', 'layer'], function(){
    var form = layui.form;
    var layer = layui.layer;
    var $ = layui.jquery;

    // 页面加载完成：读取localStorage，自动填充账号密码
    $(function(){
        // 获取本地存储数据
        let saveName = localStorage.getItem('login_user');
        let savePwd = localStorage.getItem('login_pwd');
        let isSave = localStorage.getItem('login_remember');

        // 如果存在保存记录，自动填充并勾选复选框
        if(saveName && savePwd && isSave === '1'){
            $('#username').val(saveName);
            $('#password').val(savePwd);
            $('#remember').prop('checked', true);
            form.render('checkbox'); // 刷新layui复选框样式
        }
    })

    // 监听登录提交
    form.on('submit(loginSubmit)', function(data){
        var loadIndex = layer.msg('登录中...', {icon: 16, shade: 0.3, time: 0});
        $.ajax({
            url: '/login',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data.field),
            dataType: 'json',
            success: function(res){
                layer.close(loadIndex);
                if(res.code === 200){
                    // 判断是否勾选记住密码
                    if(data.field.remember){
                        // 勾选：保存账号密码到本地存储 setItem
                        localStorage.setItem('login_user', data.field.username);
                        localStorage.setItem('login_pwd', data.field.password);
                        localStorage.setItem('login_remember', '1');
                    }else{
                        // 取消勾选：清除本地存储 removeItem
                        localStorage.removeItem('login_user');
                        localStorage.removeItem('login_pwd');
                        localStorage.removeItem('login_remember');
                    }
                    layer.msg('登录成功', {icon: 1}, function(){
                        window.location.href = '/home';
                    });
                } else {
                    layer.msg(res.msg || '登录失败', {icon: 2});
                }
            },
            error: function(){
                layer.close(loadIndex);
                layer.msg('网络异常，请稍后再试', {icon: 2});
            }
        });
        return false;
    });
});
</script>
</body>
</html>
