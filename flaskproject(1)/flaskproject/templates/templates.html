<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>离职洞察</title>
    <link rel="stylesheet" href="/static/css/layui.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { padding: 20px; background: #f5f7fa; }
        #radar-chart { width: 100%; height: 500px; }
        .insight-card { margin-top: 20px; }
    </style>
</head>
<body>
<div class="layui-card">
    <div class="layui-card-header">🧠 高风险人群画像 - 多维度对比雷达图</div>
    <div class="layui-card-body">
        <div id="radar-chart"></div>
        <div class="insight-card">
            <div class="layui-card-header">📌 解读</div>
            <div class="layui-card-body">
                <ul>
                    <li><span style="color:#FF5722;">● 高风险</span> 人群在 <strong>加班比例</strong> 维度明显凸出，说明加班是核心诱因。</li>
                    <li><span style="color:#FFB800;">● 中风险</span> 人群在 <strong>工作满意度</strong> 和 <strong>工作生活平衡</strong> 维度凹陷，提示改善空间。</li>
                    <li><span style="color:#5FB878;">● 低风险</span> 人群各项指标均衡，可作为参考基准。</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
fetch('/predict/api/insight')
    .then(res => res.json())
    .then(res => {
        if(res.code === 200){
            var data = res.data;
            var chart = echarts.init(document.getElementById('radar-chart'));
            var option = {
                legend: {
                    data: ['高风险', '中风险', '低风险'],
                    bottom: 0
                },
                radar: {
                    indicator: data.indicators.map(item => ({ name: item.name, max: item.max })),
                    center: ['50%', '45%'],
                    radius: '65%',
                    axisName: { color: '#333', fontSize: 12 }
                },
                series: [{
                    type: 'radar',
                    data: [
                        { value: data.high, name: '高风险', lineStyle: { color: '#FF5722' }, areaStyle: { color: 'rgba(255,87,34,0.3)' } },
                        { value: data.mid, name: '中风险', lineStyle: { color: '#FFB800' }, areaStyle: { color: 'rgba(255,184,0,0.3)' } },
                        { value: data.low, name: '低风险', lineStyle: { color: '#5FB878' }, areaStyle: { color: 'rgba(95,184,120,0.3)' } }
                    ],
                    symbol: 'none'
                }]
            };
            chart.setOption(option);
            window.addEventListener('resize', function(){ chart.resize(); });
        }
    });
</script>
</body>
</html>
